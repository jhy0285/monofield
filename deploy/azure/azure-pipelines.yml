trigger: none

parameters:
  - name: azureServiceConnection
    type: string
    default: '<your-azure-service-connection>'

variables:
  vmImageName: ubuntu-latest
  resourceGroupName: monofield-aci
  deploymentName: monofield-aci
  location: eastus
  templateFile: deploy/azure/container-instance.bicep
  openDesignImage: ghcr.io/jhy0285/monofield:latest
  dnsNameLabel: monofield-$(Build.BuildId)
  browserOrigin: https://monofield.example.com

pool:
  vmImage: $(vmImageName)

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Deploy MonoField to Azure Container Instances
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      useGlobalConfig: false
      inlineScript: |
        set -euo pipefail

        if [ -z "${MONOFIELD_API_TOKEN:-}" ]; then
          echo "Set MONOFIELD_API_TOKEN as a secret pipeline variable before running this pipeline." >&2
          exit 1
        fi

        if [ "$(browserOrigin)" = "https://monofield.example.com" ]; then
          echo "Set browserOrigin to the TLS origin served by your authenticated reverse proxy." >&2
          exit 1
        fi

        az group create \
          --name "$(resourceGroupName)" \
          --location "$(location)"

        az deployment group create \
          --name "$(deploymentName)" \
          --resource-group "$(resourceGroupName)" \
          --template-file "$(templateFile)" \
          --parameters \
            monofieldApiToken="$MONOFIELD_API_TOKEN" \
            image="$(openDesignImage)" \
            dnsNameLabel="$(dnsNameLabel)" \
            allowedOrigins="$(browserOrigin)"
    env:
      MONOFIELD_API_TOKEN: $(MONOFIELD_API_TOKEN)
