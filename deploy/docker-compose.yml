name: monofield

services:
  monofield:
    container_name: monofield
    image: ${MONOFIELD_IMAGE:-ghcr.io/jhy0285/monofield:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      MONOFIELD_BIND_HOST: 0.0.0.0
      MONOFIELD_ALLOWED_ORIGINS: ${MONOFIELD_ALLOWED_ORIGINS:-}
      MONOFIELD_PORT: 7456
      MONOFIELD_WEB_PORT: ${MONOFIELD_PORT:-7456}
      MONOFIELD_DATA_DIR: /app/.monofield
      MONOFIELD_API_TOKEN: ${MONOFIELD_API_TOKEN:-}
      MONOFIELD_DISABLE_API_AUTH: ${MONOFIELD_DISABLE_API_AUTH:-}
      MONOFIELD_CODEX_SANDBOX: ${MONOFIELD_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:${MONOFIELD_PORT:-7456}:7456"
    volumes:
      - monofield_data:/app/.monofield
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MONOFIELD_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  monofield_data:
